name: verify-release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar sintaxe dos scripts de distribuição
        shell: pwsh
        run: |
          $scripts = @("install.ps1", "uninstall.ps1")
          foreach ($script in $scripts) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "Erro de sintaxe em $script: $($errors[0].Message)"
            }
            Write-Host "OK: $script possui sintaxe válida."
          }
